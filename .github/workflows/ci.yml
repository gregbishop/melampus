name: ci

# Card #402: a pushed v* tag runs this same workflow, so the zips a release
# ships are built and packaged by the jobs that gate every pull request, and
# the `release` job at the end attaches them to a GitHub release. Code
# signing and notarization are card #438.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The token can read the repo and nothing else, even if a workflow step is
# compromised. The one job that writes, `release`, widens this to
# contents: write for itself alone (the release and its assets).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull-request run is cancelled; a release run is not.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    # mlx-vlm only ships Apple Silicon wheels, so CI must match the target
    # platform anyway. macos-latest is arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # lua enables the plugin tests (they self-skip without it); luac -p
      # syntax-checks every plugin file inside the suite.
      - name: Install uv and lua
        run: brew install uv lua

      # --extra build installs the pinned PyInstaller; --build-binary makes the
      # suite build dist/melampus first and smoke-test it (card #399, Done-when
      # 3: the build and the smoke test are part of the test command). The
      # build is the slow step, a few minutes on the runner. --extra cloud and
      # --extra openai put the anthropic and openai SDKs in the build venv, so
      # the executable carries them (card #434): PyInstaller bundles what the
      # venv has, and without them --backend claude prints an install hint
      # that means nothing inside a binary.
      - name: Run service and plugin tests, building the executable first
        working-directory: service
        run: uv sync --locked --extra dev --extra build --extra cloud --extra openai && uv run pytest -q --build-binary

      # Card #402: the plugin folder with the executable inside it, as a
      # release ships it, from tools/package_plugin.py (the one place that
      # knows the layout). Packaged on every run, so the command that ships
      # the zip has run on every pull request before a tag runs it for real.
      - name: Package Melampus-macOS.zip
        working-directory: service
        run: uv run python ../tools/package_plugin.py

      - name: Upload Melampus-macOS.zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Melampus-macOS
          path: dist/Melampus-macOS.zip
          if-no-files-found: error

  build-windows:
    # Card #400: the Windows executable. MLX does not exist here, so the build
    # carries everything but MLX and the smoke tests prove the executable
    # analyzes a fixture with the scripted backend and, asked for mlx, names
    # Apple Silicon and the backends that do work.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Not astral-sh/setup-uv: this repository allows only GitHub-owned
      # actions. The runner's own python installs uv, as brew does on macOS.
      # Exact-pinned: this tool comes from PyPI outside the lockfile and builds
      # the executable that is uploaded, so it is not whatever PyPI serves today.
      - name: Install uv
        run: pip install uv==0.12.17

      # lua enables the plugin tests, as brew does on macOS. Lua for Windows
      # is Lua 5.1, the Lua Lightroom itself runs: the pure suites and luac
      # run on it, and the command MelampusAnalyze.lua builds for cmd.exe is
      # built by it and run by this runner's cmd.exe against dist/melampus.exe
      # (card #401, Done-when 3). Exact-pinned like uv, installed to a fixed
      # folder so the steps after this one find it, and proven to run before
      # the minutes the build takes.
      - name: Install lua
        shell: bash
        run: |
          choco install lua --version=5.1.5.52 -y --no-progress --install-arguments='/DIR=C:\Lua'
          echo 'C:\Lua' >> "$GITHUB_PATH"
          /c/Lua/lua.exe -v

      # -v -rs: the job log is where the owner reads the proof, so it names
      # every test that ran against dist/melampus.exe, and why each one that
      # skipped did (the one that needs MLX; the two whose mock housekeeping
      # runs through sh), rather than a row of dots.
      # The same extras as the macOS job: the cloud backends are the only
      # engines this executable has, so the SDKs must be in it (card #434).
      - name: Build the executable and run its smoke tests and the plugin tests
        working-directory: service
        shell: bash
        run: uv sync --locked --extra dev --extra build --extra cloud --extra openai && uv run pytest -v -rs tests/test_binary.py tests/test_lua_plugin.py tests/test_package_plugin.py --build-binary

      - name: Upload melampus.exe
        uses: actions/upload-artifact@v4
        with:
          name: melampus-windows
          path: dist/melampus.exe
          if-no-files-found: error

      # Card #402: as the macOS job does, the zip a release ships, on every run.
      - name: Package Melampus-Windows.zip
        working-directory: service
        shell: bash
        run: uv run python ../tools/package_plugin.py

      - name: Upload Melampus-Windows.zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Melampus-Windows
          path: dist/Melampus-Windows.zip
          if-no-files-found: error

  release:
    # Card #402: on a pushed v* tag, and only then, the zips the two build
    # jobs just made are attached to a GitHub release for the tag. On a pull
    # request this job is skipped. Only here does the token write, and only
    # to contents.
    if: github.ref_type == 'tag'
    needs: [test, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Melampus-*
          path: release
          merge-multiple: true

      # gh is on the runner; the token is the workflow's own, scoped above.
      - name: Create the release with both zips attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          release/Melampus-macOS.zip release/Melampus-Windows.zip
