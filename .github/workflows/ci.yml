name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token can read the repo and nothing else, even if a workflow step is
# compromised.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # mlx-vlm only ships Apple Silicon wheels, so CI must match the target
    # platform anyway. macos-latest is arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # lua enables the plugin tests (they self-skip without it); luac -p
      # syntax-checks every plugin file inside the suite.
      - name: Install uv and lua
        run: brew install uv lua

      # --extra build installs the pinned PyInstaller; --build-binary makes the
      # suite build dist/melampus first and smoke-test it (card #399, Done-when
      # 3: the build and the smoke test are part of the test command). The
      # build is the slow step, a few minutes on the runner.
      - name: Run service and plugin tests, building the executable first
        working-directory: service
        run: uv sync --locked --extra dev --extra build && uv run pytest -q --build-binary

  build-windows:
    # Card #400: the Windows executable. MLX does not exist here, so the build
    # carries everything but MLX and the smoke tests prove the executable
    # analyzes a fixture with the scripted backend and, asked for mlx, names
    # Apple Silicon and the backends that do work.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Not astral-sh/setup-uv: this repository allows only GitHub-owned
      # actions. The runner's own python installs uv, as brew does on macOS.
      # Exact-pinned: this tool comes from PyPI outside the lockfile and builds
      # the executable that is uploaded, so it is not whatever PyPI serves today.
      - name: Install uv
        run: pip install uv==0.12.17

      # lua enables the plugin tests, as brew does on macOS. Lua for Windows
      # is Lua 5.1, the Lua Lightroom itself runs: the pure suites and luac
      # run on it, and the command MelampusAnalyze.lua builds for cmd.exe is
      # built by it and run by this runner's cmd.exe against dist/melampus.exe
      # (card #401, Done-when 3). Exact-pinned like uv, installed to a fixed
      # folder so the steps after this one find it, and proven to run before
      # the minutes the build takes.
      - name: Install lua
        shell: bash
        run: |
          choco install lua --version=5.1.5.52 -y --no-progress --install-arguments='/DIR=C:\Lua'
          echo 'C:\Lua' >> "$GITHUB_PATH"
          /c/Lua/lua.exe -v

      # -v -rs: the job log is where the owner reads the proof, so it names
      # every test that ran against dist/melampus.exe, and why each one that
      # skipped did (the one that needs MLX; the two whose mock housekeeping
      # runs through sh), rather than a row of dots.
      - name: Build the executable and run its smoke tests and the plugin tests
        working-directory: service
        shell: bash
        run: uv sync --locked --extra dev --extra build && uv run pytest -v -rs tests/test_binary.py tests/test_lua_plugin.py --build-binary

      - name: Upload melampus.exe
        uses: actions/upload-artifact@v4
        with:
          name: melampus-windows
          path: dist/melampus.exe
          if-no-files-found: error
