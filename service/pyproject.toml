[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melampus-service"
version = "0.1.0"
description = "Local species identification and quality triage for wildlife photography"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-vlm>=0.6.7",
    "pydantic>=2.9",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
melampus-id = "melampus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["melampus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
