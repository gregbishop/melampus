[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melampus-service"
version = "0.1.0"
description = "Local species identification and quality triage for wildlife photography"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The local runtime exists only on Apple Silicon. Elsewhere (Windows, Linux,
    # Intel Macs) the install succeeds without it and [model] backend selects a
    # cloud provider instead — see readme.md § Windows.
    "mlx-vlm>=0.6.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pydantic>=2.9",
    "pillow>=11",
    # quality.py imports these directly; declared so non-mac installs get them
    # rather than borrowing them transitively from mlx-vlm. opencv is gated to
    # the platforms where mlx-vlm is absent: mlx-vlm already requires the full
    # opencv-python on Apple Silicon, and installing both distributions clobbers
    # one wheel's files with the other's, leaving cv2 in an order-dependent
    # broken state.
    "numpy>=2",
    "opencv-python-headless>=4.10; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # download.py fetches the MLX model through the hub library (card #407). On
    # Apple Silicon mlx-vlm brings it anyway; declared here so the Windows
    # executable carries --download-model too.
    "huggingface_hub>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional: the cloud-escalation path (CLAUDE.md §6.6). The local pipeline never
# imports this, so a local-only install stays local-only.
cloud = ["anthropic>=0.60"]
openai = ["openai>=1.60"]
# Packaging the service and MLX into one executable (tools/build_binary.py).
# Exact-pinned: the bundle's layout is the packager's, so a silent upgrade could
# change what ships.
build = ["pyinstaller==6.22.3"]

[project.scripts]
melampus-id = "melampus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["melampus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
